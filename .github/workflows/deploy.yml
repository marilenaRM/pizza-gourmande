name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      # Preview (noindex) by default; set the repository variable PRODUCTION=true for the public launch.
      # SITE_URL follows the Pages address, including a custom domain once configured.
      - name: Build
        run: ./build.sh ${{ vars.PRODUCTION == 'true' && '--prod' || '' }}
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
